<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexander T. Bell</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg: #ffffff; --text: #17170f; --faint: #a8a8a0; --divider: rgba(23, 23, 15, 0.12); --accent: #5c6534; --mark: #6b7346; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #23261b; --text: #edeee0; --faint: #83866f; --divider: rgba(237, 238, 224, 0.14); --accent: #b9c08b; --mark: #8f9a55; }
  }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .card404 { text-align: center; padding: 56px 72px; border: 1px solid var(--divider); }
  .card404 .dash { display: block; width: 18px; height: 3px; background: var(--mark); margin: 0 auto 20px; }
  .card404 h1 { font-size: 96px; font-weight: 700; margin: 0; line-height: 1; letter-spacing: -0.04em; }
  .card404 h1 b { color: var(--mark); }
  .card404 p { margin: 12px 0 28px; color: var(--faint); }
  .card404 a { font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
  .card404 a:hover { text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
  <div class="card404">
    <span class="dash"></span>
    <h1>404<b>.</b></h1>
    <p>This page doesn't exist.</p>
    <a href="/">Back to the homepage</a>
  </div>
</body>
</html>
