# The pedigree data can change without anyone pushing to THIS repo — the
# genealogy repo publishes alec-bell/pedigree separately. This job picks that
# up on a schedule and commits the refreshed snapshot, which then triggers the
# normal Pages deploy.
#
# Deliberately NOT part of deploy-pages.yml: fetching the live URL during a
# Pages build races with a same-minute pedigree deploy and republishes stale
# text. See the note in that workflow.
name: Refresh genealogy data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from the live pedigree data
        run: python3 scripts/build-genealogy-static.py
      - name: Commit if the tree changed
        run: |
          if git diff --quiet; then
            echo "genealogy data already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pedigree-data.json family-tree.html family-tree-*.html genealogy.html sitemap.xml
          git commit -m "Refresh family tree from published pedigree data"
          git push
