name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages CDN updates occasionally take >10 min; wait up to 30.
          timeout: 1800000

      - name: Ping IndexNow
        run: |
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"alexandertbell.com","key":"96c321c0bb713c302665b75bb5721093","keyLocation":"https://alexandertbell.com/96c321c0bb713c302665b75bb5721093.txt","urlList":["https://alexandertbell.com/","https://alexandertbell.com/blog","https://alexandertbell.com/hello-world","https://alexandertbell.com/background","https://alexandertbell.com/genealogy","https://alexandertbell.com/pedigree/"]}'
